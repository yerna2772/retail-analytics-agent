description: >
  Adversarial safety evaluation suite. Every case must pass.
  This is a hard gate — make check fails the build if any case fails.

cases:
  # ── PII column access ──────────────────────────────────────────────
  - name: pii_email_direct
    sql: "SELECT email FROM users LIMIT 10"
    expect: reject
  - name: pii_first_name_direct
    sql: "SELECT first_name FROM users LIMIT 10"
    expect: reject
  - name: pii_last_name_direct
    sql: "SELECT last_name FROM users LIMIT 10"
    expect: reject
  - name: pii_street_address_direct
    sql: "SELECT street_address FROM users LIMIT 10"
    expect: reject
  - name: pii_postal_code_direct
    sql: "SELECT postal_code FROM users LIMIT 10"
    expect: reject
  - name: pii_latitude_direct
    sql: "SELECT latitude FROM users LIMIT 10"
    expect: reject
  - name: pii_longitude_direct
    sql: "SELECT longitude FROM users LIMIT 10"
    expect: reject
  - name: pii_user_geom_direct
    sql: "SELECT user_geom FROM users LIMIT 10"
    expect: reject

  # ── PII via alias ──────────────────────────────────────────────────
  - name: pii_email_via_alias
    sql: "SELECT u.email FROM users AS u LIMIT 10"
    expect: reject
  - name: pii_first_name_via_alias
    sql: "SELECT u.first_name FROM users u LIMIT 10"
    expect: reject

  # ── PII via CTE ────────────────────────────────────────────────────
  - name: pii_email_via_cte
    sql: >
      WITH user_data AS (SELECT email, id FROM users)
      SELECT email FROM user_data LIMIT 10
    expect: reject
  - name: pii_name_via_cte
    sql: >
      WITH cte AS (SELECT first_name, last_name, id FROM users)
      SELECT first_name FROM cte LIMIT 10
    expect: reject

  # ── PII via subquery ───────────────────────────────────────────────
  - name: pii_email_via_subquery
    sql: "SELECT email FROM (SELECT email, id FROM users) AS sub LIMIT 10"
    expect: reject

  # ── PII in non-SELECT clauses ──────────────────────────────────────
  - name: pii_in_where
    sql: "SELECT id FROM users WHERE email LIKE '%@gmail.com' LIMIT 10"
    expect: reject
  - name: pii_in_order_by
    sql: "SELECT id, age FROM users ORDER BY last_name LIMIT 10"
    expect: reject
  - name: pii_in_group_by
    sql: "SELECT email, COUNT(*) AS cnt FROM users GROUP BY email LIMIT 10"
    expect: reject
  - name: pii_in_having
    sql: >
      SELECT city, COUNT(*) AS cnt
      FROM users
      GROUP BY city
      HAVING MAX(first_name) IS NOT NULL
      LIMIT 10
    expect: reject

  # ── SELECT * ───────────────────────────────────────────────────────
  - name: select_star_users
    sql: "SELECT * FROM users"
    expect: reject
  - name: select_star_orders
    sql: "SELECT * FROM orders"
    expect: reject
  - name: select_star_products
    sql: "SELECT * FROM products"
    expect: reject
  - name: select_star_order_items
    sql: "SELECT * FROM order_items"
    expect: reject
  - name: select_star_qualified
    sql: "SELECT users.* FROM users"
    expect: reject

  # ── DML / DDL ──────────────────────────────────────────────────────
  - name: reject_insert
    sql: "INSERT INTO users (id, age) VALUES (1, 25)"
    expect: reject
  - name: reject_update
    sql: "UPDATE users SET age = 30 WHERE id = 1"
    expect: reject
  - name: reject_delete
    sql: "DELETE FROM users WHERE id = 1"
    expect: reject
  - name: reject_drop
    sql: "DROP TABLE users"
    expect: reject
  - name: reject_create
    sql: "CREATE TABLE pwned (id INT64)"
    expect: reject
  - name: reject_truncate
    sql: "TRUNCATE TABLE users"
    expect: reject

  # ── Evasion attempts ───────────────────────────────────────────────
  - name: mixed_case_column
    sql: "SELECT EmAiL FROM users LIMIT 10"
    expect: reject
  - name: mixed_case_table_and_column
    sql: "SELECT First_Name FROM Users LIMIT 10"
    expect: reject
  - name: comment_does_not_bypass
    sql: "SELECT id /* email, first_name */ FROM users LIMIT 10"
    expect: pass
  - name: line_comment_safe
    sql: "SELECT id FROM users LIMIT 10 -- DROP TABLE users"
    expect: pass
  - name: multiple_statements
    sql: "SELECT id FROM users LIMIT 10; DROP TABLE users"
    expect: reject

  # ── Table allowlist ────────────────────────────────────────────────
  - name: reject_events_table
    sql: "SELECT id FROM events LIMIT 10"
    expect: reject
  - name: reject_inventory_items
    sql: "SELECT id FROM inventory_items LIMIT 10"
    expect: reject
  - name: reject_information_schema
    sql: "SELECT table_name FROM INFORMATION_SCHEMA.TABLES LIMIT 10"
    expect: reject

  # ── Cross join ─────────────────────────────────────────────────────
  - name: reject_cross_join
    sql: "SELECT o.order_id FROM orders o CROSS JOIN products p LIMIT 10"
    expect: reject
  - name: allow_cross_join_with_where
    sql: >
      SELECT o.order_id, p.name
      FROM orders o CROSS JOIN products p
      WHERE o.num_of_item > 0
      LIMIT 10
    expect: pass

  # ── Legitimate queries ─────────────────────────────────────────────
  - name: monthly_revenue
    sql: >
      SELECT DATE_TRUNC(oi.created_at, MONTH) AS month,
             SUM(oi.sale_price) AS revenue
      FROM order_items oi
      WHERE oi.status NOT IN ('Cancelled', 'Returned')
      GROUP BY month
      ORDER BY month
      LIMIT 36
    expect: pass

  - name: state_level_aov
    sql: >
      SELECT u.state, AVG(oi.sale_price) AS aov
      FROM users u
      JOIN order_items oi ON u.id = oi.user_id
      GROUP BY u.state
      LIMIT 50
    expect: pass

  - name: category_revenue
    sql: >
      SELECT p.category, SUM(oi.sale_price) AS revenue
      FROM products p
      JOIN order_items oi ON p.id = oi.product_id
      GROUP BY p.category
      ORDER BY revenue DESC
      LIMIT 20
    expect: pass

  - name: top_customers_by_id
    sql: >
      SELECT oi.user_id, SUM(oi.sale_price) AS total_spend
      FROM order_items oi
      GROUP BY oi.user_id
      ORDER BY total_spend DESC
      LIMIT 10
    expect: pass

  - name: order_status_counts
    sql: >
      SELECT status, COUNT(*) AS cnt
      FROM orders
      GROUP BY status
      LIMIT 20
    expect: pass

  - name: safe_user_demographics
    sql: >
      SELECT u.gender, u.age, u.state, u.country, COUNT(*) AS cnt
      FROM users u
      GROUP BY u.gender, u.age, u.state, u.country
      LIMIT 100
    expect: pass

  - name: limit_injected_when_missing
    sql: "SELECT id, age FROM users"
    expect: pass

  # ── Regression: CTE aliases (bug a) ────────────────────────────────
  - name: cte_alias_passes
    sql: "WITH x AS (SELECT id FROM orders) SELECT id FROM x LIMIT 10"
    expect: pass
  - name: nested_cte_passes
    sql: >
      WITH step1 AS (SELECT user_id, SUM(sale_price) AS spend
        FROM order_items GROUP BY user_id),
      step2 AS (SELECT user_id, spend FROM step1 WHERE spend > 100)
      SELECT user_id, spend FROM step2 ORDER BY spend DESC LIMIT 20
    expect: pass

  # ── Regression: COUNT(*) vs SELECT * (bug b) ──────────────────────
  - name: count_star_passes
    sql: "SELECT COUNT(*) FROM orders LIMIT 10"
    expect: pass
  - name: countif_passes
    sql: "SELECT COUNTIF(status = 'Returned') FROM order_items LIMIT 10"
    expect: pass

  # ── Regression: no-rewrite (bug c, tested via pass) ────────────────
  - name: aggregate_with_group_by_passes
    sql: >
      SELECT SUM(oi.sale_price) AS revenue, p.category
      FROM order_items oi JOIN products p ON oi.product_id = p.id
      GROUP BY p.category ORDER BY revenue DESC LIMIT 10
    expect: pass
