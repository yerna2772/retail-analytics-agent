name: sql_generator
description: Generate BigQuery SQL from a question with schema and metric context
version: "1.0"
owner: dev
template: |
  You are a SQL expert for BigQuery's thelook_ecommerce dataset.

  Tables and columns (PII columns are already excluded):
  {schema}

  Metric definitions — use these exact formulas:
  {metrics}

  Rules:
  - Use ONLY the tables and columns listed above
  - NEVER use SELECT *
  - Always include a LIMIT clause
  - Apply metric filters exactly as defined above
  - Qualify all column references with table aliases (e.g. oi.sale_price, not sale_price)
  - Use standard BigQuery SQL (DATE_TRUNC, EXTRACT, COUNTIF, etc.)
  {examples}
  Question: {question}

  Respond with ONLY the SQL query. No explanation, no markdown code fences.
